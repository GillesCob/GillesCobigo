<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="./logo.png">
<title>Aperçu avis Google : 1 avis affichés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --vert-fonce:#3E6D2A; --vert-clair:#7DAF74; --accent:#FFAD34; --creme:#F0EBD0; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Nunito',-apple-system,sans-serif; color:var(--vert-fonce); background:var(--creme); line-height:1.6;}
  section{padding:80px 24px;}
  h2{font-family:'Fredoka','Nunito',sans-serif; font-weight:700; font-size:32px; margin-bottom:40px;}
  .btn{display:inline-block; padding:14px 32px; background:var(--accent); color:var(--vert-fonce); text-decoration:none; border-radius:30px; font-weight:700;}
  .avis{background:var(--vert-fonce); color:#fff; text-align:center;}
  .avis-grid{max-width:900px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:center; gap:24px;}
  .avis-card{background:rgba(255,255,255,.08); border-radius:16px; padding:24px; text-align:left; flex:1 1 260px; max-width:280px;}
  .avis-card .stars{color:var(--accent); font-size:18px; margin-bottom:10px;}
  .avis-card p{font-size:14px; opacity:.9;}
  .avis-card .name{margin-top:12px; font-weight:700; font-size:13px;}
  .avis-cta{margin-top:24px;}
  .tag-repli{display:inline-block; margin-bottom:24px; padding:6px 16px; border-radius:30px; background:#fff; color:var(--vert-fonce); font-size:13px; font-weight:700;}
</style>
</head>
<body>
<section class="avis">
  <span class="tag-repli">Aperçu : 1 avis avec commentaire trouvés sur les 5 envoyés par Google</span>
  <h2>Ce qu'on dit de nous</h2>
  <div class="avis-grid">
    <div class="avis-card"><div class="stars">★★★★★</div><p>« Exemple d'avis, en attente du branchement du proxy Google (VPS) »</p><div class="name">Une cliente</div></div>
  </div>
  <div class="avis-cta">
    <a class="btn" href="https://maps.app.goo.gl/qJPVNdqvCL5cuXr58" target="_blank" rel="noopener noreferrer">Voir tous les avis</a>
  </div>
</section>
</body>
</html>
