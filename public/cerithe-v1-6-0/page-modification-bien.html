  <script>
    (function () {
      var fromUrl = new URLSearchParams(window.location.search).get('theme');
      var stored = localStorage.getItem('vault-theme');
      var theme = fromUrl || stored;
      if (theme) { document.documentElement.setAttribute('data-theme', theme); }
    })();
    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      var next = isDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('vault-theme', next);
    }
    function selectBasement(btn) {
      var siblings = btn.parentElement.querySelectorAll('.basement-toggle-btn');
      siblings.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
    }
  </script>
  <title>Cerithe - Page de modification du bien (niveaux sous-sol)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-page: #f9fafb; --border: #e5e7eb; --text-dark: #111827; --text-muted: #6b7280;
      --accent: #2563eb; --accent-hover: #1d4ed8; --card-bg: #ffffff;
      --danger-border: #fecaca; --danger-text: #dc2626; --danger-bg: #fef2f2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #0d1117; --border: #30363d; --text-dark: #e6edf3; --text-muted: #8b949e; --card-bg: #161b22;
        --danger-border: #6e2626; --danger-bg: rgba(220,38,38,0.08);
      }
    }
    :root[data-theme="dark"] {
      --bg-page: #0d1117; --border: #30363d; --text-dark: #e6edf3; --text-muted: #8b949e; --card-bg: #161b22;
      --danger-border: #6e2626; --danger-bg: rgba(220,38,38,0.08);
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: var(--bg-page); min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 16px; }
    h1 { font-family: "Poppins", "Inter", sans-serif; }

    .theme-toggle { position: fixed; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
    .theme-toggle svg { width: 15px; height: 15px; }

    .page-inner { width: 100%; max-width: 448px; }
    .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text-muted); text-decoration: none; margin-bottom: 16px; }
    .back-link svg { width: 16px; height: 16px; }

    form { background: var(--card-bg); padding: 32px; border-radius: 16px; border: 1px solid var(--border); width: 100%; display: flex; flex-direction: column; gap: 16px; }
    form h1 { font-size: 20px; font-weight: 700; color: var(--text-dark); margin: 0; }

    input, select { border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 15px; font-family: inherit; background: var(--card-bg); color: var(--text-dark); width: 100%; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label { font-size: 11.5px; color: var(--text-muted); }

    .basement-toggle { display: inline-flex; gap: 6px; }
    .basement-toggle-btn { height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 500; font-family: inherit; color: var(--text-muted); background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s; }
    .basement-toggle-btn:hover { background: var(--bg-page); }
    .basement-toggle-btn.active { color: #fff; background: var(--accent); border-color: var(--accent); }

    .btn-submit { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 13.5px; font-weight: 500; cursor: pointer; }
    .btn-submit:hover { background: var(--accent-hover); }
    .btn-delete { font-size: 13.5px; border: 1px solid var(--danger-border); color: var(--danger-text); background: none; border-radius: 8px; padding: 10px; cursor: pointer; }
    .btn-delete:hover { background: var(--danger-bg); }

    @media (max-width: 480px) {
      form { padding: 22px 18px; gap: 12px; }
      form h1 { font-size: 17px; }
      input, select { font-size: 13.5px; padding: 8px 12px; }
      .btn-submit, .btn-delete { font-size: 12.5px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Changer de theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  </button>

  <div class="page-inner">
    <a href="#" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Retour
    </a>

    <form onsubmit="return false;">
      <h1>Modifier le bien</h1>

      <input type="text" value="Maison de Cognac" />
      <input type="text" value="12 rue des Vignes, 16100 Cognac" />

      <select>
        <option selected>Maison</option>
        <option>Appartement</option>
      </select>

      <input type="number" value="120" />

      <div class="field">
        <span class="field-label">Niveaux hors-sol</span>
        <input type="number" value="2" />
      </div>

      <div class="field">
        <span class="field-label">Niveaux en sous-sol</span>
        <div class="basement-toggle">
          <button type="button" class="basement-toggle-btn active" onclick="selectBasement(this)">Aucun</button>
          <button type="button" class="basement-toggle-btn" onclick="selectBasement(this)">1 niveau (-1)</button>
        </div>
      </div>

      <button type="submit" class="btn-submit">Enregistrer</button>
      <button type="button" class="btn-delete">Supprimer ce bien</button>
    </form>
  </div>
</body>
</html>
